<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="348" viewBox="0 0 1200 348"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MirageOS — 桌面是真的，其余都是梦</title>
  <desc id="hero-desc">MirageOS：一个跑在浏览器里的仿 macOS 幻觉操作系统。每次开机，AI 依当日 GitHub Trending 现场梦出壁纸、主题与 10 个虚构中文应用；右侧是一个正在被流式「画出来」的迷你桌面窗口。</desc>

  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25358C"/>
      <stop offset="100%" stop-color="#101736"/>
    </linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D4FD8"/>
    </linearGradient>
    <linearGradient id="gradS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#2E9EDB"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- 背景板 -->
  <rect width="1200" height="348" rx="24" fill="#0B0E1F"/>
  <rect width="1200" height="348" rx="24" fill="url(#bgGlow)"/>

  <!-- 星点（梦境残像，弱装饰） -->
  <g fill="#8A93B8">
    <circle cx="238" cy="52" r="1.3" opacity="0.4"/>
    <circle cx="470" cy="38" r="1.0" opacity="0.3"/>
    <circle cx="618" cy="66" r="1.6" opacity="0.3"/>
    <circle cx="662" cy="150" r="1.0" opacity="0.25"/>
    <circle cx="204" cy="180" r="1.0" opacity="0.2"/>
  </g>
  <path d="M576,96 l2.2,5.6 5.6,2.2 -5.6,2.2 -2.2,5.6 -2.2,-5.6 -5.6,-2.2 5.6,-2.2 z" fill="#8B5CF6" opacity="0.5"/>

  <!-- ===== 左：标题区 ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">

    <!-- 眉题：红黄绿灯 + 分类 -->
    <circle cx="69" cy="66" r="5" fill="#FF5F57"/>
    <circle cx="88" cy="66" r="5" fill="#FEBC2E"/>
    <circle cx="107" cy="66" r="5" fill="#28C840"/>
    <text x="126" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" letter-spacing="2.5" fill="#8A93B8">AI-DREAMED OS · SEEDED BY GITHUB TRENDING</text>

    <!-- 梦眼徽标 + 项目名 -->
    <g transform="translate(82 158)">
      <circle r="17" fill="none" stroke="#8B5CF6" stroke-width="2.4" opacity="0.9"/>
      <path d="M-9.5,0 Q0,-8.5 9.5,0 Q0,8.5 -9.5,0 Z" fill="#EAF0FF" opacity="0.92"/>
      <circle r="3.1" fill="#8B5CF6"/>
    </g>
    <text x="114" y="181" font-size="66" font-weight="700" fill="#EAF0FF">MirageOS</text>

    <!-- 价值主张 -->
    <text x="64" y="228" font-size="24" font-weight="600" fill="#EAF0FF">桌面是真的，其余都是梦。</text>
    <text x="64" y="257" font-size="15" fill="#8A93B8">The desktop is real — everything else is a dream.</text>

    <!-- 三个机制词条 -->
    <g font-size="15">
      <g>
        <rect x="64" y="284" width="132" height="34" rx="17" fill="#141A3C" stroke="#2A3160"/>
        <circle cx="86" cy="301" r="3.5" fill="#8B5CF6"/>
        <text x="102" y="306.5" fill="#C6CDEA">开机即梦</text>
      </g>
      <g>
        <rect x="208" y="284" width="132" height="34" rx="17" fill="#141A3C" stroke="#2A3160"/>
        <circle cx="230" cy="301" r="3.5" fill="#38BDF8"/>
        <text x="246" y="306.5" fill="#C6CDEA">现场作画</text>
      </g>
      <g>
        <rect x="352" y="284" width="132" height="34" rx="17" fill="#141A3C" stroke="#2A3160"/>
        <circle cx="374" cy="301" r="3.5" fill="#8A93B8"/>
        <text x="390" y="306.5" fill="#C6CDEA">重启归零</text>
      </g>
    </g>
  </g>

  <!-- ===== 右：正在被梦出的迷你桌面 ===== -->
  <g>
    <!-- 窗口框架 -->
    <rect x="720" y="50" width="400" height="248" rx="14" fill="#131836" stroke="#2E3564" stroke-width="1.5"/>
    <path d="M734,50 h372 a14,14 0 0 1 14,14 v20 h-400 v-20 a14,14 0 0 1 14,-14 z" fill="#1B2248"/>
    <line x1="720" y1="84" x2="1120" y2="84" stroke="#2A3160"/>
    <circle cx="742" cy="67" r="5" fill="#FF5F57"/>
    <circle cx="762" cy="67" r="5" fill="#FEBC2E"/>
    <circle cx="782" cy="67" r="5" fill="#28C840"/>
    <text x="930" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#8A93B8">今日桌面 · dreaming…</text>

    <!-- 壁纸底色 -->
    <rect x="732" y="92" width="376" height="192" rx="10" fill="url(#wallGrad)" opacity="0.5"/>

    <!-- 应用图标：三个已成，一个正在画，两个未梦 -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#EAF0FF" text-anchor="middle">
      <rect x="834" y="112" width="40" height="40" rx="10" fill="url(#gradV)"/>
      <text x="854" y="137">✦</text>
      <rect x="900" y="112" width="40" height="40" rx="10" fill="url(#gradS)"/>
      <text x="920" y="137">◉</text>
      <rect x="966" y="112" width="40" height="40" rx="10" fill="#4653B8"/>
      <text x="986" y="137">▦</text>
    </g>
    <rect x="834" y="176" width="40" height="40" rx="10" fill="#8B5CF6" fill-opacity="0.08"
          stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="845" y="190" width="3.5" height="12" rx="1" fill="#8B5CF6"/>
    <rect x="900" y="176" width="40" height="40" rx="10" fill="none" stroke="#2A3160" opacity="0.55"/>
    <rect x="966" y="176" width="40" height="40" rx="10" fill="none" stroke="#2A3160" opacity="0.55"/>

    <!-- 生成进度 -->
    <rect x="766" y="246" width="308" height="5" rx="2.5" fill="#232A55"/>
    <rect x="766" y="246" width="190" height="5" rx="2.5" fill="url(#progGrad)"/>
    <text x="920" y="273" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" fill="#8A93B8">▌ 正在梦出第 4 / 10 个今日应用</text>
  </g>
</svg>
